<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js" defer></script>
</head>

<body>
    <main>
        <header>
            <nav class="contentLimit mainHeader">
                <img src="./assets/img/Logo 02.svg" alt="">
                <img src="./assets/img/burger-menu.svg" alt="">
            </nav>
        </header>
        <section class="contentLimit mainStart">
            <img class="atfImage" src="./assets/img/atf-image.jpg" alt="">
            <img class="burgerLogo" src="./assets/img/burger-logo.png" alt="">
            <div class="mainHeading">
                <img src="./assets/img/burger-house.svg" alt="">
                <img src="./assets/img/rating.svg" alt="">
            </div>
            <h2>The best of Burgers, Pizza and Greens, all in one great place.</h2>
        </section>

        <section id="burgerMenu">
            <div class="MenuHeading">
                <h1 class="contentLimit">Burger & Sandwiches</h1>
            </div>
        </section>

        <div class="contentLimit dishContainer">
            <div>
                <img class="dish-img" src="/assets/img/veggie-burger.jpg" alt="">
            </div>
            <div>
                <div class="dishTitleAndPrice">
                    <h3>Veggie mushroom black burger</h3>
                    <p>16,90€</p>
                </div>
                <div>
                    <p class="ingredients">Mixed green salad, Tomatoes, Edamame, Mushrooms</p>
                </div>
                <div class="addToBasketButtons">
                    <img src="./assets/img/added-button.svg" alt="">
                    <img src="./assets/img/add-dish-button.svg" alt="">
                </div>
            </div>
        </div>
    </main>

</body>

</html>
