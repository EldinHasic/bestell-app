<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/basket.css">
    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js" defer></script>
    <script src="./scripts/basket.js" defer></script>
</head>

<body onload="init()">
    <main>
        <header>
            <nav class="contentLimit mainHeader">
                <img src="./assets/img/Logo 02.svg" alt="app-logo">
                <img src="./assets/img/burger-menu.svg" alt="burger-menu">
            </nav>
        </header>
        <section class="contentLimit mainStart">
            <img class="atfImage" src="./assets/img/atf-image.jpg" alt="dishes-overview">
            <img class="burgerLogo" src="./assets/img/burger-logo.png" alt="restaurant-logo">

            <div class="mainHeading">
                <img src="./assets/img/burger-house.svg" alt="restaurant-name">
                <img src="./assets/img/rating.svg" alt="restaurant-rating">
            </div>
            <h2>The best of Burgers, Pizza and Greens, all in one great place.</h2>
        </section>

        <div class="contentLimit content_wrapper">
            <section class="content">

                <article class="MenuHeading">
                    <div>
                        <img class="dishIcon" src="/assets/img/burger-icon.svg" alt="burger-icon">
                    </div>
                    <div>
                        <h1 class="contentLimit">Burger</h1>
                    </div>
                </article>

                <section id="burgerMenu"></section>

                <article class="MenuHeading">
                    <div>
                        <img class="dishIcon" src="/assets/img/pizza-icon.svg" alt="pizza-icon">
                    </div>
                    <div>
                        <h1 class="contentLimit">Pizza (30cm)</h1>
                    </div>
                </article>

                <section id="PizzaMenu"></section>

            </section>

            <section class="basket_wrapper">
                <div class="basket_content">
                    <h1>Your Basket</h1>
                    <div id="basketDish">

                    </div>
                </div>
            </section>
        </div>

        </section>
        <section>

            </div>

    </main>

</body>

</html>
